<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <!-- handnote のアイコン：深い藍に真鍮のペン先。角は端末が丸めるので正方形のまま -->
  <defs>
    <radialGradient id="bg" cx="80%" cy="0%" r="115%">
      <stop offset="0" stop-color="#2D4C8C"/><stop offset="0.55" stop-color="#16244A"/><stop offset="1" stop-color="#0C1224"/>
    </radialGradient>
    <radialGradient id="haze" cx="35%" cy="70%" r="45%">
      <stop offset="0" stop-color="#3A2F55" stop-opacity="0.7"/><stop offset="1" stop-color="#3A2F55" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0DDAE"/><stop offset="0.5" stop-color="#C9A86A"/><stop offset="1" stop-color="#9C7A3E"/>
    </linearGradient>
  </defs>
  <rect width="180" height="180" fill="url(#bg)"/>
  <rect width="180" height="180" fill="url(#haze)"/>
  <path d="M90 36 L119 92 Q119 115 90 140 Q61 115 61 92 Z" fill="url(#brass)"/>
  <path d="M90 92 V138" stroke="#0C1224" stroke-width="3"/>
